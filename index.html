<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — HTML-форма с валидацией</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrapper">
    <form id="registerForm" action="/submit" method="post" novalidate>
      <h2>📝 Регистрация</h2>
      <p class="subtitle">Заполните все поля корректно</p>

      <!-- Имя -->
      <div class="field">
        <label for="name">Имя</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Введите имя"
          required
          minlength="2"
          maxlength="30">
        <small class="error" id="error-name"></small>
      </div>

      <!-- Email -->
      <div class="field">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="example@mail.com"
          required>
        <small class="error" id="error-email"></small>
      </div>

      <!-- Пароль -->
      <div class="field">
        <label for="password">Пароль</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Минимум 6 символов"
          required
          minlength="6">
        <small class="error" id="error-password"></small>
      </div>

      <!-- Город -->
      <div class="field">
        <label for="city">Город</label>
        <select id="city" name="city" required>
          <option value="">— Выберите город —</option>
          <option value="almaty">Алматы</option>
          <option value="astana">Астана</option>
          <option value="shymkent">Шымкент</option>
          <option value="karaganda">Караганда</option>
        </select>
        <small class="error" id="error-city"></small>
      </div>

      <!-- Комментарий -->
      <div class="field">
        <label for="comment">Комментарий</label>
        <textarea
          id="comment"
          name="comment"
          placeholder="Ваш комментарий..."
          maxlength="200"></textarea>
        <small class="counter" id="counter">0 / 200</small>
      </div>

      <button type="submit">Отправить</button>

      <div class="success" id="successMessage">
        ✅ Форма успешно отправлена!
      </div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
